<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillPath | Roadmap</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <link rel="stylesheet" href="css/roadmap.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            <i class="fa-solid fa-route"></i>
            SkillPath
        </div>

        <div>

            <button id="darkBtn">
                🌙
            </button>

            <a href="dashboard.html" class="back">
                Dashboard
            </a>

        </div>

    </nav>



    <!-- Header -->

    <header class="header">

        <h1 id="careerTitle">

            Loading...

        </h1>

        <p>

            Complete every skill to unlock your certificate.

        </p>

    </header>



    <!-- Progress -->

    <section class="progressSection">

        <h2>Your Progress</h2>

        <div class="progressBar">

            <div id="progressFill"></div>

        </div>

        <h3 id="progressText">

            0%

        </h3>

    </section>



    <!-- Search -->

    <section class="searchBox">

        <input
            type="text"
            id="search"
            placeholder="Search any skill...">

    </section>



    <!-- Roadmap -->

    <section>

        <div id="roadmapContainer">

        </div>

    </section>



    <!-- Achievement -->

    <section class="achievement">

        <h2>

            🏆 Achievements

        </h2>

        <div id="badges">

            No achievements yet.

        </div>

    </section>



    <!-- Certificate -->

    <section class="certificate">

        <button id="certificateBtn">

            📜 Download Certificate

        </button>

    </section>



    <!-- Skill Popup -->

    <div id="popup" class="popup">

        <div class="popup-content">

            <span id="closePopup">

                &times;

            </span>

            <h2 id="popupTitle"></h2>

            <p id="popupDescription"></p>

            <h4>

                Mini Project

            </h4>

            <p id="popupProject"></p>

            <h4>

                Learning Time

            </h4>

            <p id="popupTime"></p>

        </div>

    </div>



<script>

const roadmaps = {

"Web Development":[

{
name:"HTML",
description:"Structure of every website.",
project:"Build Resume Website",
time:"2 Days"
},

{
name:"CSS",
description:"Design beautiful websites.",
project:"Netflix Landing Page",
time:"3 Days"
},

{
name:"JavaScript",
description:"Add interactivity.",
project:"Calculator",
time:"7 Days"
},

{
name:"React",
description:"Frontend Library",
project:"Todo App",
time:"10 Days"
},

{
name:"Node.js",
description:"Backend JavaScript",
project:"REST API",
time:"8 Days"
}

],



"Python Development":[

{
name:"Python Basics",
description:"Learn syntax and variables.",
project:"Number Guess Game",
time:"5 Days"
},

{
name:"Functions",
description:"Create reusable code.",
project:"Calculator",
time:"3 Days"
},

{
name:"OOP",
description:"Classes and Objects.",
project:"Library Management",
time:"7 Days"
},

{
name:"Flask",
description:"Web framework.",
project:"Blog Website",
time:"7 Days"
}

],



"Cyber Security":[

{
name:"Networking",
description:"Computer Networks",
project:"Packet Analyzer",
time:"5 Days"
},

{
name:"Linux",
description:"Linux Commands",
project:"Linux Practice",
time:"5 Days"
},

{
name:"OWASP",
description:"Top Security Risks",
project:"Secure Login",
time:"7 Days"
},

{
name:"Burp Suite",
description:"Pen Testing",
project:"Vulnerability Scan",
time:"5 Days"
}

]

};



const career = localStorage.getItem("career");

document.getElementById("careerTitle").innerHTML=career+" Roadmap";

const container=document.getElementById("roadmapContainer");

const skills=roadmaps[career];

let completed=0;



skills.forEach((skill,index)=>{

const card=document.createElement("div");

card.className="skillCard";



card.innerHTML=`

<input type="checkbox" class="check">

<h2>${skill.name}</h2>

<p>${skill.description}</p>

<button>View Details</button>

`;



container.appendChild(card);



const btn=card.querySelector("button");



btn.onclick=function(){

document.getElementById("popup").style.display="flex";

document.getElementById("popupTitle").innerHTML=skill.name;

document.getElementById("popupDescription").innerHTML=skill.description;

document.getElementById("popupProject").innerHTML=skill.project;

document.getElementById("popupTime").innerHTML=skill.time;

}



card.querySelector(".check").onchange=function(){

completed=this.checked?completed+1:completed-1;

let percent=Math.floor((completed/skills.length)*100);

document.getElementById("progressFill").style.width=percent+"%";

document.getElementById("progressText").innerHTML=percent+"%";



if(percent>=25){

document.getElementById("badges").innerHTML="🥉 Beginner";

}

if(percent>=50){

document.getElementById("badges").innerHTML="🥈 Explorer";

}

if(percent>=100){

document.getElementById("badges").innerHTML="🥇 Skill Master 🎉";

}

}



});



document.getElementById("closePopup").onclick=function(){

document.getElementById("popup").style.display="none";

}



document.getElementById("search").addEventListener("keyup",function(){

let value=this.value.toLowerCase();

let cards=document.querySelectorAll(".skillCard");

cards.forEach(card=>{

let text=card.innerText.toLowerCase();

card.style.display=text.includes(value)?"block":"none";

});

});



document.getElementById("certificateBtn").onclick=function(){

if(completed!=skills.length){

alert("Complete every skill first.");

return;

}

window.location.href="certificate.html";

}



document.getElementById("darkBtn").onclick=function(){

document.body.classList.toggle("dark");

}

</script>

</body>

</html>
